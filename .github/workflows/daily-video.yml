name: Daily video generator

on:
  schedule:
    - cron: "0 19 * * *"   # 12:30 AM IST = 19:00 UTC previous day
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  make-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick fonts-dejavu
      - name: Install Python packages
        run: pip install edge-tts moviepy==1.0.3
      - name: Generate video
        run: python auto_video.py
      - name: Save as latest.mp4 in repo
        run: |
          mv output.mp4 latest.mp4
          git config user.name "video-bot"
          git config user.email "bot@users.noreply.github.com"
          git add latest.mp4
          git commit -m "Daily video" || echo "nothing to commit"
          git push
